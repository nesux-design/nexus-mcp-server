name: Fix PKCE helpers

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Add missing PKCE helpers without changing other code
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/oauth/routes.js')
          s = p.read_text()
          if 'function createPkceVerifier()' not in s:
              anchor = '''function securityHeaders() {\n  return {\n    "cache-control": "no-store",\n    "pragma": "no-cache",\n    "x-content-type-options": "nosniff"\n  };\n}\n'''
              helpers = '''\nfunction createPkceVerifier() {\n  const bytes = crypto.getRandomValues(new Uint8Array(32));\n  return base64Url(bytes);\n}\n\nasync function createPkceChallenge(verifier) {\n  const digest = await crypto.subtle.digest("SHA-256", encoder.encode(verifier));\n  return base64Url(new Uint8Array(digest));\n}\n'''
              if anchor not in s:
                  raise SystemExit('Expected securityHeaders block not found; refusing to modify file')
              s = s.replace(anchor, anchor + helpers, 1)
          p.write_text(s)
          PY
      - name: Commit fix and remove this temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/oauth/routes.js
          git rm .github/workflows/fix-pkce.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Fix missing PKCE helpers'
          git push
